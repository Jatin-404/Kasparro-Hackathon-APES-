services:
  postgres:
    image: postgres:16-alpine
    container_name: apes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apes_db}
      POSTGRES_USER: ${POSTGRES_USER:-apes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apes_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apes_postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apes_user} -d ${POSTGRES_DB:-apes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: apes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@apes.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - apes_pgadmin_data:/var/lib/pgadmin

volumes:
  apes_postgres_data:
  apes_pgadmin_data:
